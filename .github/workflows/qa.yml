name: Quality Assurance
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  actions: read
concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    name: Static checks and regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify JavaScript syntax
        run: |
          node --check src/app.js
          node qa/static-checks.cjs
      - name: Run regression tests
        run: npm test
      - name: Check whitespace and patch errors
        run: git diff --check
  dependency-review:
    if: github.event_name == 'pull_request'
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
